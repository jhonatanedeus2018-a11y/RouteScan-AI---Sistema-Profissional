name: Build RouteScan AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | sdkmanager --licenses || true

      - name: Instalar dependências
        run: npm install

      - name: Gerar versão web
        run: npm run build

      - name: Preparar plataforma Android usando a configuração existente
        run: |
          npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          npx cap add android
          npx cap sync android

      - name: Compilar APK de depuração
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Validar APK gerado
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"
          ls -lh "$APK"

      - name: Disponibilizar APK direto
        uses: actions/upload-artifact@v4
        with:
          name: RouteScan-AI-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
