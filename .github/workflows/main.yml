
name: Build RouteScan AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || exit 1
          yes | sdkmanager --licenses || true

      - name: Instalar dependências
        run: npm install

      - name: Gerar versão web
        run: npm run build

      - name: Configurar Capacitor
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "RouteScan AI" "com.routescan.ai" --web-dir dist
          npx cap add android
          npx cap copy android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RouteScan-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
